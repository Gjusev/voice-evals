name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra probe
      - run: uv run ruff check src tests scripts kaggle-kernel examples
      # Fully offline: live tests are marker-gated AND hard-blocked under CI.
      - run: uv run pytest -q -m "not live"
      - run: uv run voice-eval run evals/data/demo_calls.jsonl --max-wer 0.05 --min-task-completion 0.5
      - run: uv run voice-eval run evals/data/replay_v02.jsonl --max-wer 0.7
