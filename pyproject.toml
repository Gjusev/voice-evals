[project]
name = "voice-evals"
version = "0.2.1"
description = "Evaluation harness for voice agents: replay scoring plus a scripted live probe with WER, latency budgets, barge-in behavior and task outcomes."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Gjusev" }]
keywords = [
  "voice-agents",
  "speech",
  "wer",
  "latency",
  "evaluation",
  "llm",
  "stt",
  "tts",
  "ci",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = ["jiwer>=3.0"]

[project.optional-dependencies]
probe = ["httpx>=0.27,<0.29", "websockets>=15,<16"]

[project.urls]
Homepage = "https://github.com/Gjusev/voice-evals"
Repository = "https://github.com/Gjusev/voice-evals"
Changelog = "https://github.com/Gjusev/voice-evals/releases"

[project.scripts]
voice-eval = "voice_evals.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "jsonschema>=4.20", "httpx>=0.27,<0.29", "websockets>=15,<16"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: real network endpoints; opt-in via VOICE_EVALS_LIVE_TESTS=1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_evals"]

[tool.ruff]
line-length = 100
target-version = "py310"
